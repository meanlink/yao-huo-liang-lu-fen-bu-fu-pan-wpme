name: kiln-yield
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-yield}-db
    environment:
      POSTGRES_DB: analysis
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LocalAnalysis2026}
    ports: ["${DB_PORT:-17700}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app -d analysis"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-yield}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-yield}-backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://app:${DB_PASSWORD:-LocalAnalysis2026}@db:5432/analysis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-kiln-yield-development-only}
      SEED_DEMO: ${SEED_DEMO:-true}
      ARTIFACT_DIR: /artifacts
    ports: ["${BACKEND_PORT:-19200}:8000"]
    volumes: ["analysis-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 35
      start_period: 15s
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-yield}-worker
    command: ["python", "-m", "src.worker"]
    environment: *app-env
    volumes: ["analysis-artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<30"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-kiln-yield}-frontend
    ports: ["${FRONTEND_PORT:-18200}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  analysis-artifacts:
